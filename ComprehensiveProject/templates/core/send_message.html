{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Send Message - Student Tutoring System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2>Send Message to {{ receiver.username }}</h2>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Send Message</button>
                        <a href="{% url 'messages' %}" class="btn btn-outline-secondary">Back to Messages</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
